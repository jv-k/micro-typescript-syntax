name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum
      - name: Fixtures and rule coverage
        working-directory: test
        run: go test ./...
