filetype: typescript-rules

# The TypeScript rules, included by typescript.yaml and tsx.yaml. No `detect`:
# micro never picks this file on its own. The rules live here, not in
# typescript.yaml, because micro resolves an include by filetype and also
# ships a built-in `typescript`, which an include of `typescript` can pick up.

# Micro applies patterns in order, each overwriting the colours of the ones
# before it, and colours whole matches (no capture groups). Several rules
# below lean on that: a broad rule paints a span, a later rule repaints part
# of it. Strings and comments are regions, which always beat patterns.
rules:
    # ─── Declared names ──────────────────────────────────────────────────────
    # These come first so the rules after them repaint everything in each
    # match except the name.
    - identifier.const: "\\bconst\\s+[A-Za-z_$][A-Za-z0-9_$]*"

    # Arrow functions, `fn = (a) =>`, `fn: T = async (a): R =>`, `fn: (a) =>`:
    # paint name and signature, then reset the signature. The type `T` stops
    # at a comma outside `<…>` (two levels deep), so in `f(a: A, cb = () =>)`
    # only `cb` is a function name.
    - identifier.function: "[A-Za-z_$][A-Za-z0-9_$]*((\\s*\\??:\\s*([^=;,<]|<([^<>]|<[^<>]*>)*>)+?)?\\s*=|\\s*\\??:)\\s*(async\\s*)?(<[^<>]*>\\s*)?(\\([^()]*\\)|[A-Za-z_$][A-Za-z0-9_$]*)(\\s*:\\s*[^=;]+?)?\\s*=>"
    - default: "((\\s*\\??:\\s*([^=;,<]|<([^<>]|<[^<>]*>)*>)+?)?\\s*=|\\s*\\??:)\\s*(async\\s*)?(<[^<>]*>\\s*)?(\\([^()]*\\)|[A-Za-z_$][A-Za-z0-9_$]*)(\\s*:\\s*[^=;]+?)?\\s*=>"

    - symbol.brackets: "[(){}]|\\[|\\]"
    - symbol.braces: "[{}]"
    - symbol.operator: "[-+/*=<>!~%?:&|^]"
    - symbol.punctuation: "[.,;]"

    # ─── Keywords and types ──────────────────────────────────────────────────
    - statement: "\\b(abstract|accessor|as|asserts|async|await|break|case|catch|constructor|continue)\\b"
    - statement: "\\b(debugger|declare|default|delete|do|else|enum|export|extends|finally|for|from)\\b"
    - statement: "\\b(get|if|implements|import|in|infer|instanceof|interface|is|keyof|module|namespace)\\b"
    - statement: "\\b(new|of|override|package|private|protected|public|readonly|require|return|satisfies)\\b"
    - statement: "\\b(set|static|super|switch|this|throw|try|typeof|unique|using|void|while|with|yield)\\b"

    - statement.var: "\\bvar\\b"
    - statement.let: "\\blet\\b"
    - statement.const: "\\b(const|type)\\b"
    - statement.class: "\\bclass\\b"
    - statement.function: "\\bfunction\\b"

    - type: "\\b(Array|BigInt|Boolean|Date|Enumerator|Error|Function|Map|Math|Number|Object)\\b"
    - type: "\\b(Promise|RegExp|Set|String|Symbol|WeakMap|WeakSet)\\b"
    - type: "\\b(Awaited|Omit|Parameters|Partial|Pick|Readonly|Record|Required|ReturnType)\\b"
    - type.types: "\\b(any|bigint|boolean|never|number|object|string|symbol|unknown)\\b"

    # React and Next.js types, and hooks (`useState`, `useRouter`, any `useX`)
    - type: "\\b(ComponentProps|CSSProperties|Dispatch|FC|JSX|PropsWithChildren|ReactElement|ReactNode|RefObject|SetStateAction)\\b"
    - type: "\\b(AppProps|GetServerSideProps|GetStaticProps|Metadata|NextPage|NextRequest|NextResponse)\\b"
    - identifier.function.hook: "\\buse[A-Z][A-Za-z0-9]*\\b"

    # ─── Keywords used as plain names ────────────────────────────────────────
    # After a dot (`item.type`, `p.catch`), as an object or param key
    # (`{ type: 'x' }`), before a dot (`module.exports`) or as a call
    # (`of(1)`, `get(url)`). Reset them, then repaint the symbols swallowed.
    - default: "\\.\\s*(abstract|accessor|any|as|asserts|async|await|bigint|boolean|break|case|catch|class|const|constructor|continue|debugger|declare|default|delete|do|else|enum|export|extends|finally|for|from|function|get|if|implements|import|in|infer|instanceof|interface|is|keyof|let|module|namespace|never|new|number|object|of|override|package|private|protected|public|readonly|require|return|satisfies|set|static|string|super|switch|symbol|this|throw|try|type|typeof|unique|unknown|using|var|void|while|with|yield)\\b"
    - default: "\\b(abstract|accessor|as|asserts|async|await|break|case|catch|class|const|constructor|continue|debugger|declare|default|delete|do|else|enum|export|extends|finally|for|from|function|get|if|implements|import|in|infer|instanceof|interface|is|keyof|let|module|namespace|new|of|override|package|private|protected|public|readonly|require|return|satisfies|set|static|switch|throw|try|type|typeof|unique|using|var|while|with|yield)\\??\\s*:"
    - default: "\\b(abstract|accessor|as|asserts|async|constructor|declare|from|get|infer|is|keyof|module|namespace|of|override|package|readonly|require|satisfies|set|type|unique|using)\\s*\\."
    - default: "\\b(declare|from|get|is|module|namespace|of|set|type|using)\\s*\\("
    - symbol.brackets: "\\("
    - symbol.punctuation: "\\."
    - symbol.operator: "[?:]"

    # `default:` is a switch label when the line ends after it, opens a
    # block, or jumps; otherwise it's an object key, reset above.
    - statement: "\\bdefault\\s*:(\\s*$|\\s*\\{\\s*$|\\s*(break|return|throw|continue)\\b)"
    - symbol.braces: "[{}]"

    # ─── Literals ────────────────────────────────────────────────────────────
    - constant: "\\b(null|undefined|NaN)\\b"
    - constant.bool.false: "\\bfalse\\b"
    - constant.bool.true: "\\btrue\\b"

    # Decimal and float (1_000, 1.5, 1e-3), leading-dot float (.5), then
    # integer, hex, binary and octal with an optional BigInt suffix (10n).
    - constant.number: "\\b[0-9](_?[0-9])*(\\.([0-9](_?[0-9])*)?)?([eE][+-]?[0-9](_?[0-9])*)?"
    - constant.number: "\\B\\.[0-9](_?[0-9])*([eE][+-]?[0-9](_?[0-9])*)?"
    - constant.number: "\\b([0-9](_?[0-9])*|0[xX][0-9a-fA-F](_?[0-9a-fA-F])*|0[bB][01](_?[01])*|0[oO][0-7](_?[0-7])*)n?\\b"

    # ─── Late name fixes ─────────────────────────────────────────────────────
    - identifier.function: "\\bfunction\\b\\s*\\*?\\s*[A-Za-z_$][A-Za-z0-9_$]*"
    - statement.function: "\\bfunction\\b\\s*\\*?"
    # A const named like a keyword (`const type = …`) lost its colour above
    - identifier.const: "\\bconst\\s+(as|async|declare|from|get|is|module|namespace|of|readonly|set|type|using|any|bigint|boolean|never|number|object|string|symbol|unknown)\\b"
    - statement: "\\benum\\b"
    - statement.const: "\\bconst\\b"
    # Same for `let` and `var`, whose names are otherwise uncoloured
    - default: "\\b(let|var)\\s+(as|async|declare|from|get|is|module|namespace|of|readonly|set|type|using|any|bigint|boolean|never|number|object|string|symbol|unknown)\\b"
    - statement.let: "\\blet\\b"
    - statement.var: "\\bvar\\b"

    # ─── Regex literals ──────────────────────────────────────────────────────
    # A `/` is a regex, not division, when no word character touches it
    # (`\B`) and the body doesn't start with a space: `a / b / c` and `a/b/c`
    # stay division. The body can't hold a bare `>`, which keeps JSX
    # `</a>…</b>` and `<A /> <B />` from reading as regexes.
    - constant.string.regex: "\\B/([^/\\\\\\[\\s*>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])([^/\\\\\\[>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])*/[dgimsuvy]*"
    - constant.specialChar: "\\\\."
    # `)` or `]` then `/` is division (CoffeeScript's CALLABLE): `(a)/b/c`.
    # Skip a `/` followed by flags then a non-word character (`)/g,`,
    # `]/.test`): that is the end of a regex, not division.
    - default: "[)\\]]\\s*/[dgimsuvy]*[abcefhjklnopqrtwxzA-Z0-9_$(]([^/\\\\\\[>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])*/[dgimsuvy]*"

    # ─── Comments and strings ────────────────────────────────────────────────
    # The `skip` patterns stop a quote or `//` inside a regex literal from
    # opening a string or comment. They only skip regexes that follow an
    # operator, bracket or `return`, so `'/a' + '/b'` stays two strings.
    - comment:
        start: "//"
        end: "$"
        skip: "([=(,:\\[!&|?{};]|\\breturn|\\btypeof|=>)\\s*/([^/\\\\\\[\\s*>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])([^/\\\\\\[>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])*/"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    - comment:
        start: "/\\*"
        end: "\\*/"
        rules:
            # function documentation
            - identifier: "\\s\\*\\s.*"
            - todo: "(TODO|XXX|FIXME):?"

    # Plain strings can't span lines, so an unclosed quote stops at the end
    # of its line. The region paints the quotes, the rules paint the body.
    - constant.quotes:
        start: "\""
        end: "\"|$"
        skip: "\\\\.|([=(,:\\[!&|?{};]|\\breturn|\\btypeof|=>)\\s*/([^/\\\\\\[\\s*>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])([^/\\\\\\[>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])*/"
        rules:
            - constant.string: ".*"
            - constant.stringEscaped: "\\\\."

    # Also skips apostrophes between letters (JSX text like `don't`), where
    # no string can start or end.
    - constant.quotes:
        start: "'"
        end: "'|$"
        skip: "\\\\.|[A-Za-z]'[a-z]|([=(,:\\[!&|?{};]|\\breturn|\\btypeof|=>)\\s*/([^/\\\\\\[\\s*>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])([^/\\\\\\[>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])*/"
        rules:
            - constant.string: ".*"
            - constant.stringEscaped: "\\\\."

    # Template literals: only these interpolate. RE2 can't balance braces, so
    # `${…}` handles one level of nesting, e.g. `${fn({ a })}`.
    - constant.quotes:
        start: "`"
        end: "`"
        skip: "\\\\.|([=(,:\\[!&|?{};]|\\breturn|\\btypeof|=>)\\s*/([^/\\\\\\[\\s*>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])([^/\\\\\\[>]|\\\\.|\\[([^\\]\\\\]|\\\\.)*\\])*/"
        rules:
            - constant.string: ".*"
            - constant.stringEscaped: "\\\\."
            - constant.tplLiterals.expression: "\\x24\\{([^{}]|\\{[^{}]*\\})*\\}"
